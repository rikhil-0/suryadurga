<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sri Suryadurga General Stores</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f5f5f5;color:#333}

/* HEADER */
header{
background:linear-gradient(135deg,#d62828,#f77f00);
color:white;text-align:center;padding:40px 20px;
}

/* NAV */
nav{
background:#111;
text-align:center;
padding:12px;
position:sticky;top:0;
}
nav a{
color:white;margin:0 15px;text-decoration:none;
}

/* SECTION */
section{padding:40px 20px}
.container{max-width:1100px;margin:auto}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 6px 16px rgba(0,0,0,0.1);
text-align:center;
}

.product h3{margin-bottom:10px}

.qty{
width:60px;
padding:6px;
margin:10px 0;
}

.btn{
background:#d62828;
color:white;
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
}

/* CART */
.cart{
background:white;
padding:20px;
border-radius:12px;
margin-top:30px;
}

.cart-item{
margin-bottom:10px;
}

/* FORM */
input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* ORDER BUTTON */
.order-btn{
background:#25D366;
color:white;
padding:14px;
border:none;
border-radius:10px;
width:100%;
font-size:16px;
cursor:pointer;
}

footer{
background:#111;color:white;text-align:center;padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>SRI SURYADURGA GENERAL STORES</h1>
<p>Fancy • Gifts • Daily Essentials</p>
</header>

<nav>
<a href="#products">Products</a>
<a href="#order">Order</a>
</nav>

<!-- PRODUCTS -->

<section id="products">
<div class="container">
<h2>Products</h2>

<div class="products">

<div class="product">
<h3>Fancy Bangles</h3>
<p>₹50</p>
<input type="number" value="1" min="1" class="qty" id="q1">
<button class="btn" onclick="add('Fancy Bangles',50,'q1')">Add</button>
</div>

<div class="product">
<h3>Gift Articles</h3>
<p>₹120</p>
<input type="number" value="1" min="1" class="qty" id="q2">
<button class="btn" onclick="add('Gift Articles',120,'q2')">Add</button>
</div>

<div class="product">
<h3>Decor Items</h3>
<p>₹90</p>
<input type="number" value="1" min="1" class="qty" id="q3">
<button class="btn" onclick="add('Decor Items',90,'q3')">Add</button>
</div>

</div>

</div>
</section>

<!-- ORDER -->

<section id="order">
<div class="container">

<h2>Your Order</h2>

<div class="cart" id="cart"></div>

<h3>Customer Details</h3>

<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Phone Number" required>
<textarea id="address" placeholder="Delivery Address" required></textarea>

<button class="order-btn" onclick="placeOrder()">Place Order on WhatsApp</button>

</div>
</section>

<footer>
© 2026 Sri Suryadurga General Stores
</footer>

<script>
let cart=[];

function add(name,price,id){
let qty=document.getElementById(id).value;
cart.push({name,price,qty});
render();
}

function render(){
let html="";
cart.forEach(item=>{
html += `<div class="cart-item">
${item.name} x ${item.qty} = ₹${item.price*item.qty}
</div>`;
});
document.getElementById("cart").innerHTML=html;
}

function placeOrder(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;

let msg=`Order from Sri Suryadurga Stores%0A`;
cart.forEach(i=>{
msg += `${i.name} x ${i.qty}%0A`;
});
msg += `%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}`;

window.open(`https://wa.me/919985385382?text=${msg}`);
}
</script>

</body>
</html>
